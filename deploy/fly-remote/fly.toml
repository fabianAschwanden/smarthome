# Fly-App: öffentlicher Login-Proxy für den Remote-Zugang (siehe docs/remote/SETUP.md).
# Nur dieser Dienst ist im Internet erreichbar; er erzwingt OIDC-Login (oauth2-proxy)
# und reicht authentifizierte Requests über das Fly-6PN an den Heim-Server (:8080) weiter.
#
# App-Name anpassen und deployen:
#   flyctl launch --no-deploy --copy-config
#   flyctl secrets set OIDC_ISSUER_URL=… OIDC_CLIENT_ID=… OIDC_CLIENT_SECRET=… \
#                      COOKIE_SECRET=$(openssl rand -base64 32) UPSTREAM=http://[<6pn-ip>]:8080
#   flyctl deploy

app = "smarthome-remote"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4180          # oauth2-proxy Standard-Port
  force_https = true
  # Kein Schlafen mehr (18.09.2026): Nach einem Stopp von mehreren Stunden war die
  # Maschine ueber 6PN nicht mehr erreichbar - der Proxy lief, der Login klappte,
  # aber "dial tcp [heimserver]:8080: i/o timeout", weil die Antwort des Heimservers
  # die Maschine nie erreichte. Ein frischer Klon ging sofort, ein sofortiger
  # stop/start schadete nicht, erst langes Stehen. Maschinen, die durchlaufen, bleiben
  # erreichbar. Die ~2 $/Monat fuer eine wache shared-cpu-1x sind der Preis dafuer,
  # dass der Remote-Zugriff nicht nach jeder laengeren Pause tot ist.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
