# go2rtc – Stream-Gateway: wandelt Kamera-RTSP (auch H.265) in browser-taugliches
# WebRTC/MSE. Vorlage – echte Datei: deploy/go2rtc/go2rtc.yaml (gitignored, enthält
# die Kamera-IP).
#
#   cp deploy/go2rtc/go2rtc.example.yaml deploy/go2rtc/go2rtc.yaml
#   # rtsp-URL der Kamera eintragen (siehe docs/camera/SPEC.md)
#
# Der Stream-Name (hier "garten") muss zu camera.devices[i].stream in der
# App-Config passen.

streams:
  garten:
    - rtsp://<kamera-ip>:554/mpeg4   # Tuya/Hankvision-Cam, H.265, kein Auth
    # Browser-WebRTC kann H.265 NICHT dekodieren -> zusätzlich nach H.264 transkodieren
    # (ffmpeg ist im go2rtc-Image enthalten). Ohne diese Zeile bleibt der Player im
    # Browser auf "Loading" stehen. '#hardware' nur, wenn HW-Encoding verfügbar ist.
    - ffmpeg:garten#video=h264

api:
  # NUR Loopback: die App proxyt /go2rtc/* selbst nach 127.0.0.1:1984 (Go2rtcProxy) und
  # laesst dabei nur Player-Pfade durch. Auf ":1984" waere die Admin-API ungeschuetzt im
  # LAN und im Fly-6PN erreichbar - und die kann per 'exec:'-Stream Kommandos im
  # Container ausfuehren und die RTSP-URL preisgeben.
  listen: "127.0.0.1:1984"

webrtc:
  listen: ":8555"        # WebRTC (TCP); im LAN/6PN erreichbar
  # candidates:          # feste Kandidaten ergänzen, wenn der Browser die intern
  #   - <server-ip>:8555 # angekündigte Docker-IP (172.x) nicht erreichen kann
