# Heim-Server-Deployment (Mini-PC / kleiner Linux-Host im LAN). Nur Docker nötig.
# Start:  cd deploy && cp .env.example .env && nano .env && docker compose up -d --build
#
# Hostet Backend (Quarkus inkl. Angular), PostgreSQL und den Tuya/Midea-Sidecar.
# Das iPad/Tablet öffnet danach nur:  http://<server-ip>:8080
#
# WICHTIG – Host-Netzwerk:
#   Die Tuya-Geräteerkennung nutzt UDP-Broadcasts (Port 6666/6667), die ein
#   Docker-Bridge-Netz NICHT durchquert. Darum laufen die Container im Host-Netz
#   (network_mode: host). Das funktioniert auf einem Linux-Host (Mini-PC/Pi).
#   Auf Docker Desktop (macOS/Windows) ist host-mode nur eingeschränkt – der
#   echte Betrieb gehört auf den Linux-Host im LAN.

services:
  db:
    image: postgres:18
    network_mode: host
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in deploy/.env}
      # Postgres 18: Mount auf /var/lib/postgresql, Daten in Unterverzeichnis (PGDATA).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smarthome']
      interval: 10s
      timeout: 5s
      retries: 5

  sidecar:
    build:
      context: ../tools/tuya-sidecar
    image: local/smarthome-sidecar:latest
    network_mode: host
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      # Nur Loopback: der Sidecar hat keine eigene Auth, /spa/control steuert Geräte und
      # /read testet beliebige (ip, local-key)-Paare. Die App läuft im selben Host-Netz
      # und erreicht ihn weiterhin über http://127.0.0.1:8765.
      HOST: 127.0.0.1
      PORT: 8765

  # Stream-Gateway: wandelt Kamera-RTSP (H.265) in browser-taugliches MP4/H.264
  # (bzw. WebRTC im LAN). Die App proxyt /go2rtc/* an localhost:1984 (host-Netz),
  # damit der Kamera-Stream über Port 8080 läuft – auch remote durch den Fly-Tunnel.
  # Config (mit Kamera-IP) liegt gitignored in deploy/go2rtc/go2rtc.yaml.
  go2rtc:
    # Version gepinnt: :latest zieht bei jedem Neustart ungeprueft neuen Code in
    # einen Container mit Host-Netz.
    image: alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    network_mode: host
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: local/smarthome:latest
    network_mode: host
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      - db
      - sidecar
    environment:
      # Profil 'lan' = LAN-Betrieb: echte Geräte, kein OIDC, DB per Env.
      QUARKUS_PROFILE: lan
      DB_URL: jdbc:postgresql://localhost:5432/smarthome
      DB_USERNAME: smarthome
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in deploy/.env}
      SMARTHOME_TUYA_SIDECAR_URL: http://localhost:8765
    # Geräte-IPs, device-ids und local-keys/Token kommen aus der gitignored
    # config/application.properties (überschreibt application.properties zur Laufzeit).
    volumes:
      - ../config:/app/config:ro

volumes:
  db-data:
