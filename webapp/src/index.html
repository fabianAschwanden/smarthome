<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Smart Home</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f5d86" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- use-credentials: Manifest-Anfragen laufen per Default OHNE Cookies. Hinter dem
         Login-Proxy (Fly/oauth2-proxy) landen sie dadurch auf der Google-Loginseite
         und scheitern mit einem CORS-Fehler. -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <!-- iOS: als eigenständige App vom Homescreen starten -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Smart Home" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
